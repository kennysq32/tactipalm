# U-Boot distro boot. @PARTUUID@ is substituted by build-image.sh.
#
# root= must NOT use LABEL=. The kernel's own device resolver understands
# /dev/xxx, MAJ:MIN and PARTUUID=, but a filesystem LABEL is resolved by udev
# or blkid inside an initramfs — and we deliberately boot without one. Using
# LABEL= here produces exactly this, with the root filesystem present and
# healthy on the card:
#
#   VFS: Cannot open root device "" or unknown-block(0,0)
#   Kernel panic - not syncing: VFS: Unable to mount root fs
#
# U-Boot distro boot. console=ttyS0 is the GPIO-header UART — keep it first so
# early boot is visible on serial before anything else works.
#
# The mode is pinned to 1280x720@60 rather than left to EDID negotiation. The
# monitor was confirmed to report "connected" with a mode list under the vendor
# kernel, so the link is good; pinning removes the case where the panel's
# preferred mode is 4K, the H616 HDMI PHY declines it, and we read the black
# screen as a driver failure. 720p is the target resolution anyway (PLAN.md 1).
#
# To let the kernel negotiate instead, delete the video= argument. This file is
# on the card's boot partition and can be edited without rebuilding anything.
DEFAULT tactipalm
TIMEOUT 10

LABEL tactipalm
    MENU LABEL Tactipalm (6.18.49)
    LINUX /boot/Image
    FDT   /boot/dtbs/allwinner/sun50i-h618-orangepi-zero2w.dtb
    APPEND root=PARTUUID=@PARTUUID@ rw rootwait console=ttyS0,115200 console=tty1 loglevel=7 cma=64M video=HDMI-A-1:1280x720@60
