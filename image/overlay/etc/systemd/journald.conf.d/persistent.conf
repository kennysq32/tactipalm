# Persist the journal to disk.
#
# There is no UART adapter yet, and U-Boot cannot drive HDMI on the H616, so
# the only way to read a failed boot is to power off, move the card to a PC and
# read the log. That requires the journal to survive a reboot.
[Journal]
Storage=persistent
SystemMaxUse=64M
ForwardToConsole=yes
MaxLevelConsole=info
